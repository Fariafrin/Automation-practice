# eslint-disable yml/block-sequence 
name: Playwright Tests

on:
    push:
        branches: [CI/CD-Branch]
    pull_request:
        branches: [CI/CD-Branch]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            -   name: ⬇️ Checkout repository
                uses: actions/checkout@v4

            -   name: 🟢 Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: 20
                    # ⛔️ DO NOT use cache here; pnpm will handle it
                    cache: "none"

            -   name: ⬇️ Setup pnpm
                uses: pnpm/action-setup@v2
                with:
                    version: 8 # Replace with your local version if different
                    run_install: false

            -   name: ⚙️ Enable pnpm caching
                uses: actions/cache@v4
                with:
                    path: ~/.pnpm-store
                    key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                    restore-keys: |
                        ${{ runner.os }}-pnpm-store-

            -   name: 📦 Install dependencies
                run: pnpm install

            -   name: ⬇️ Install Playwright Browsers
                run: pnpm exec playwright install --with-deps

            -   name: 🧪 Run Playwright Tests
                run: pnpm exec playwright test

            -   name: 📤 Upload Monocart Report
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: monocart-report
                    path: artifacts/test_reports/monocart-report
